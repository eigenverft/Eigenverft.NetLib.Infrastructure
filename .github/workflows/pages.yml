name: pages.yml

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/.config/docfx/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Eigenverft.NetLib.Infrastructure.slnx

      - name: Install DocFX
        run: dotnet tool install --tool-path ./.tools docfx --version 2.74.1

      - name: Prepare DocFX configuration
        shell: pwsh
        run: |
          $templatePath = '.github/workflows/.config/docfx/build/docfx_local.template.json'
          $configPath = '.github/workflows/.config/docfx/build/docfx_pages.json'
          $indexTemplatePath = '.github/workflows/.config/docfx/build/index.template.md'
          $indexPath = '.github/workflows/.config/docfx/build/index.md'

          $sourceDirectory = (Join-Path $env:GITHUB_WORKSPACE 'src/prj/Eigenverft.NetLib.Infrastructure').Replace('\', '/')
          $outputDirectory = (Join-Path $env:GITHUB_WORKSPACE 'output/pages').Replace('\', '/')
          $appName = 'Eigenverft.NetLib.Infrastructure'

          $config = Get-Content $templatePath -Raw
          $config = $config.Replace('{{sourceCodeDirectory}}', $sourceDirectory)
          $config = $config.Replace('{{outputDirectory}}', $outputDirectory)
          $config = $config.Replace('{{appName}}', $appName)
          Set-Content -Path $configPath -Value $config -Encoding utf8

          $index = Get-Content $indexTemplatePath -Raw
          $index = $index.Replace('{{appName}}', $appName)
          Set-Content -Path $indexPath -Value $index -Encoding utf8

      - name: Build DocFX site
        run: ./.tools/docfx .github/workflows/.config/docfx/build/docfx_pages.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
