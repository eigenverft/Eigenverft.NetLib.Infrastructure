interface:
  display_name: "Execute Repo Workspace Sync and Publish"
  short_description: "Discover, synchronize, and publish Git repositories"
  default_prompt: "Use $execute-repo-workspace-sync-and-publish to discover the repository or workspace targets and synchronize every relevant branch, not only the current checkout. Preserve all worktrees and working changes; fetch and prune complete remote branch namespaces without tags; distinguish actual remote, remote-tracking, and local tracking branches; create only unambiguous required tracking branches; retire a remote-deleted local branch only when its redundancy is strictly proven and otherwise preserve and report it; when a deeper read-only preservation analysis could help, offer it as an optional follow-up without running it or requiring exact identifier syntax; proportionally assess local-only branch and working-change publication intent; integrate without rewriting history; publish with explicit normal branch pushes; independently verify every relevant remote head; report routine repositories compactly and expand only changed or exceptional branches; use direct commands or already-existing trusted interfaces without generating helper scripts; and do not add unrelated builds, tests, product work, artifact publication, tag operations, remote-branch deletion, or force-push behavior."
