interface:
  display_name: "Execute Handoff Set Reconciliation"
  short_description: "Reconcile conflicting multi-agent handoff sets"
  default_prompt: "Use $execute-handoff-set-reconciliation to inspect the existing AGENTS/HANDOFF collection as hash-scoped producing-run sets. Apply a strict no-op when only one set exists or when multiple sets are already compatible. Reconcile by coherent implementation topic and boundary; do not collapse distinct independently plannable topics merely to reduce file count. When harmful overlap, duplication, contradiction, staleness, or ordering conflict exists, recheck the current codebase, decide the authoritative technical direction, and repair only existing handoff files. Keep every canonical handoff complete and standalone. Mark a file `Status: superseded` only when its entire useful scope is absorbed, no independent implementation task remains, and the canonical destinations are complete without it; then move the verified redirect to AGENTS/HANDOFF/SUPERSEDED/ while preserving its filename. Keep partially overlapping handoffs active with narrowed scopes. Never create a new handoff and never implement product changes."
