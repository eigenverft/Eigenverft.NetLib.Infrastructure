interface:
  display_name: "Execute Implementation Handoff Queue to Completion"
  short_description: "Plan and implement AGENTS/HANDOFF work"
  default_prompt: "Use $execute-implementation-handoff-queue-to-completion as the executing agent for the complete selected top-level AGENTS/HANDOFF queue. Do not delegate the loop and do not pause for confirmation after partial progress. Ignore DONE/ and SUPERSEDED/ as active queues. For a valid top-level file marked `Status: superseded`, follow its canonical destinations, implement any active destinations once, and archive the redirect in AGENTS/HANDOFF/SUPERSEDED/ after every destination is completed or already in DONE/. Never move an archived redirect to DONE/. Revalidate each actionable handoff against current source and earlier completed work, reduce the plan to the remaining delta, decide whether each optional recommendation should be implemented, rejected, or deferred, use the harness plan function when available, implement and verify one handoff at a time, and move each completed actionable file into AGENTS/HANDOFF/DONE/ with its original filename. Continue until the selected top-level queue is clean or only unavoidable blockers remain. Do not commit or push unless explicitly requested."
