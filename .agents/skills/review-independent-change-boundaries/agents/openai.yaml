interface:
  display_name: "Review Independent Change Boundaries"
  short_description: "Review team-scalable ownership and change isolation"
  default_prompt: "Use $review-independent-change-boundaries as a source-first, read-only review of team-scalable change boundaries. Select representative current or likely change scenarios and trace their path through implementation, ownership, contracts, state, tests, build structure, configuration, and integration. Use source evidence, current work descriptions, and optional Git co-change history; judge locality qualitatively as local, mostly local, coordinated, or system-wide and state uncertainty instead of inventing numeric precision. Return only high- or medium-confidence chat findings where a practical boundary change would reduce recurring cross-group coordination, shared-hotspot edits, or coupled verification. Recommend the smallest coherent ownership area, the lightest useful contract, an incremental migration slice, compatibility protection, and focused verification. Keep physical separation and enforcement proportional, preserve atomic business invariants, and treat legitimate platform-wide changes separately from weak feature boundaries. Use zero findings when the current structure fits its scale, returning exactly 'Boundary review complete. Material findings: 0.' Keep repository state unchanged."
