interface:
  display_name: "Execute Tracked Initial Handoff Creation and Sync"
  short_description: "Create and sync initial handoffs through isolated remote runs"
  default_prompt: "Use $execute-tracked-initial-handoff-creation-and-sync and apply its complete SKILL.md contract. Resolve the selected repository with Git rather than workspace-layout assumptions. Preserve every checkout and worktree that existed when the run started: never switch, detach, pull, merge, rebase, reset, clean, commit, or push them. Establish repository-local sibling runtime worktrees at <repository-root>/.tracked-handoff-runtime/worktrees/<session-hash>-produce, -integrate-NN, or -recover-NN and the local TRACKED_HANDOFFS/INITIAL mirror only after safely adding and verifying the required anchored rules in <git-common-dir>/info/exclude; never modify a versioned .gitignore. Update session records through validated same-directory temporary files and atomic replacement. Build mirror refreshes completely in the ignored runtime staging area and perform only the short verified transaction-style swap under the mirror lock. Detect actually affected enclosing Git worktrees and add only narrow local exclude rules when the runtime or mirror would otherwise dirty them. Reject tracked, symlinked, unrelated, or unattributed runtime paths. Use uniquely owned sibling producing, integration, and recovery worktrees under the ignored runtime root; never nest a worktree inside another worktree. Use their local Handoff branches only for pure TRACKED_HANDOFFS/INITIAL storage work. For every skill-owned worktree, commit, and push operation, use a session-owned empty hooks path, disable commit/tag/push signing, disable tag-following, and use explicit full refspecs without changing persistent customer Git configuration. Verify staged and committed Handoff blobs byte-for-byte against the authored files before the first push, bypassing local content filters only for the session-owned index entries when necessary. Use tracked-handoffs/initial/current as the integrated collection and tracked-handoffs/initial/run/<12-character-hash> as the remotely saved result of each producing run. Before investigation, discover the required remote Handoff refs and fetch them with --no-write-fetch-head and explicit refspecs into refs/tracked-handoff-initial-sessions/<session-hash>/remote/... rather than shared remote-tracking refs; when that option is unavailable, serialize only the short fetch operation with the fallback fetch lock; reject the legacy tracked-handoffs branch, validate pure-storage branches, recover safe local artifacts, integrate safely recoverable open remote runs, and delete only runs whose complete contribution is byte-identical in current or has completed the explicit collision-replacement terminal proof, and whose remote object ID still matches the verified object under an explicit expected-object lease. Treat a local mirror file as publication-ready only when its filename, first heading, Source context, Intended outcome, and absence of draft/private markers satisfy the SKILL.md import contract; placement alone is not authorization. Inspect product source read-only. Record the identity of materially used evidence and recheck it before finalizing; when relevant files changed concurrently, re-read them and block rather than publish a mixed-state conclusion if a coherent state cannot be established. Do not run builds, tests, restores, applications, setup, initialization, maintenance, migrations, formatting, generation, runbooks, one-time procedures, or unrelated repository automation merely as verification. Do not suppress a source-grounded Initial Handoff merely because an existing Initial Handoff overlaps; semantic combination and deduplication belong to later Reconcile work. Author initial-handoff-<hash>-NN-<topic>.md files only. Persist the full Initial base in the session record and in matching Tracked-Handoff-Run and Tracked-Handoff-Base commit trailers; a normal result has exactly one commit whose sole parent is that base, while the first empty phase uses an orphan commit declaring EMPTY. Publish the unique remote run ref create-only without replacing an existing ref, then fetch-verify its object, provenance, tree, and bytes before attempting append-only current integration. Create the first initial/current ref only with an absent-ref lease; if another agent creates it first, fetch and integrate normally. For a path collision, publish a fresh one-commit replacement run from newest verified current, record the original run OID and old-to-new path mapping, prove normalized identity-only replacement, and only then OID-delete the original run. Resolve current races through fetch, rebuild, normal push, and bounded increasing-backoff retries with small random jitter so concurrent agents do not retry in lockstep; never force-push. Preserve remote runs when integration remains pending, and preserve local runtime worktrees only when remote verification did not succeed. Clean proven inactive owned sessions in the canonical order from worktrees through exact refs to the session record last; leave uncertain Git administration metadata as cleanup debt, use a new hash-scoped path, and continue independent work rather than requesting user cleanup. Delegate only when the user explicitly requests subagents; the parent owns Git synchronization and publication, and delegated subagents must not delegate further. Do not reconcile, create a complete implementation plan, implement, or interpret lifecycle state. On clean success return only integrated TRACKED_HANDOFFS/INITIAL paths produced by this top-level assignment, not unrelated older runs recovered during synchronization. If this assignment was integrated but an independent malformed or unresolved synchronization problem remains, return the mixed blocker defined by SKILL.md with the safe integrated paths and the separate unresolved issue; do not hide it behind path-only success. When no Handoff qualifies, put NO_HANDOFFS_CREATED on the first line and, for a Markdown-based assignment, add only the cautious close/archive/delete recommendation allowed by SKILL.md without modifying the source. On failure state the exact local or remote preservation state and the next safe action."
