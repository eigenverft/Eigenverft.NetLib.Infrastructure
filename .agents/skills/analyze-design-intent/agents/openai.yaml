interface:
  display_name: "Design Intent Analysis"
  short_description: "Reconstruct why something exists and when it is useful"
  default_prompt: "Use $analyze-design-intent as a read-only reconstruction of why the selected target likely exists. Inherit the target from the immediate conversation when already established. Treat the target as the question boundary, not the evidence boundary: inspect any surrounding implementation, documentation, configuration, data, workflows, automation, metadata, usage, tests, or history only when it can materially change the explanation. Do not privilege code or force a predefined artifact or persona taxonomy. Start from purpose: identify the situation or recurring problem that makes the target worth having, who or what benefits, what becomes easier or safer, what would be worse without it, and which design choices or trade-offs plausibly explain its shape. Treat retries, persistence, caches, fields, formats, and other mechanics primarily as evidence rather than findings. Reconstruct why information is retained or processes are arranged as they are when relevant. After establishing observed use, think one level beyond the immediately visible scope and identify plausible adjacent, future, or more general uses of the same design, clearly separating observed use, strongly implied use, plausible wider use, present rationale, and historical origin. Organize the final answer by the user's actual topic or discovered topics rather than by analysis stages, and keep all source and repository/workspace state unchanged."
